name: LP Banner Check

on:
  workflow_dispatch:
    # 🌟 ここを追加：GitHubの画面に入力ボックス（テキスト欄）を作ります
    inputs:
      lp_urls:
        description: 'チェックするLPのURL（カンマ区切りで複数入力可）'
        required: true
        type: string

jobs:
  # -----------------------------------------------------------------
  # 1. 画面から入力されたURL文字列を分解して、JSONの配列形式に変換するジョブ
  # -----------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      thread_ts: ${{ steps.slack-init.outputs.thread_ts }}
    steps:
      - name: Generate URL matrix
        id: set-matrix
        env:
          # 🌟 Secretsからではなく、画面の入力欄（inputs）の値を読み込むように変更
          RAW_URLS: ${{ github.event.inputs.lp_urls }}
        run: |
          URLS_JSON=$(node -e "console.log(JSON.stringify(process.env.RAW_URLS.split(',').map(u => u.trim()).filter(Boolean)))")
          echo "matrix=${URLS_JSON}" >> $GITHUB_OUTPUT

      # 最初に1通だけ親メッセージを投稿してID（ts）を記憶する
      - name: Create Parent Slack Message
        id: slack-init
        run: |
          RES=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"channel":"${{ secrets.SLACK_CHANNEL }}","text":"🚀 *LPバナーチェックを一括開始しました* (並列処理中...)"}' \
            https://slack.com/api/chat.postMessage)
          TS=$(echo $RES | jq -r '.ts')
          echo "thread_ts=${TS}" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------
  # 2. 分解したURLの数だけ、並列でチェックを実行するジョブ
  # -----------------------------------------------------------------
  check:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lp_url: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 5 
      fail-fast: false 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run check script
        env:
          LP_URL: ${{ matrix.lp_url }} 
          PARENT_THREAD_TS: ${{ needs.prepare.outputs.thread_ts }} 
          BANNER_URL: ${{ secrets.BANNER_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          YOOM_WEBHOOK_URL: ${{ secrets.YOOM_WEBHOOK_URL }}
        run: node check.mjs
