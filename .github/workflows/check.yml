name: LP Banner Check

on:
  workflow_dispatch:
    inputs:
      lp_urls:
        description: 'チェックするLPのURL（カンマ区切りで複数入力可・空欄の場合はlp_urls.txtを参照します）'
        required: false
        default: ''
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      thread_ts: ${{ steps.slack-init.outputs.thread_ts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate URL matrix
        id: set-matrix
        env:
          RAW_URLS: ${{ github.event.inputs.lp_urls }}
        run: |
          # 入力欄が空欄の場合は lp_urls.txt（1行1URL、#で始まる行・空行は無視）を参照する。
          # 入力欄に直接URLが入っていればそちらを優先する。
          if [ -z "$(echo "$RAW_URLS" | tr -d '[:space:]')" ]; then
            echo "ℹ️ lp_urls が空欄のため lp_urls.txt を参照します"
            RAW_URLS=$(grep -v '^\s*#' lp_urls.txt | grep -v '^\s*$' | paste -sd ',' -)
          fi
          export RAW_URLS
          URLS_JSON=$(node -e "console.log(JSON.stringify(process.env.RAW_URLS.split(',').map(u => u.trim()).filter(Boolean)))")
          echo "matrix=${URLS_JSON}" >> $GITHUB_OUTPUT

      - name: Create Parent Slack Message
        id: slack-init
        run: |
          RES=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"channel":"${{ secrets.SLACK_CHANNEL }}","text":"🚀 *LPバナーチェックを一括開始しました* (並列処理中...)"}' \
            https://slack.com/api/chat.postMessage)
          TS=$(echo $RES | jq -r '.ts')
          echo "thread_ts=${TS}" >> $GITHUB_OUTPUT

  check:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lp_url: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 5
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 👇 ここを追加して、ブラウザと必要なシステムライブラリを強制インストールします
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Run check script
        env:
          LP_URL: ${{ matrix.lp_url }}
          PARENT_THREAD_TS: ${{ needs.prepare.outputs.thread_ts }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
        run: node check.mjs
